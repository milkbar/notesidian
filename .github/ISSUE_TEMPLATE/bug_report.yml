name: 🐛 Bug report
description: Something in Notesidian isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster we can track it down.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: When I …, Notesidian …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug, so we can see it too.
      placeholder: |
        1. Open Notesidian with ⌥⌘N
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 14.5 (Sonoma)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notesidian version
      description: You'll find it in the settings panel ▸ About.
      placeholder: e.g. 1.0.0
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, screen recordings, or anything else
      description: Drag files in here — a short screen recording is worth a thousand words.
    validations:
      required: false
