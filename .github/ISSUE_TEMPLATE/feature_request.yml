name: 💡 Feature request
description: Suggest an idea or improvement for Notesidian.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it. Tell us about the **workflow** you're trying to improve — not just the feature — so we can find the best way to solve it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the workflow you wish were smoother.
      placeholder: I'm always … and I wish I could …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Your proposed solution, if you have one in mind.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Anything you've tried, or other ways this could work.
    validations:
      required: false
