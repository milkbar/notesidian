<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1a72"/>
      <stop offset="0.5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="panelShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#1a0b3a" flood-opacity="0.45"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="panelClip"><rect x="290" y="120" width="620" height="760" rx="26"/></clipPath>
  </defs>

  <!-- wallpaper -->
  <rect width="1200" height="1200" fill="url(#wall)"/>
  <circle cx="300" cy="980" r="260" fill="#a78bfa" opacity="0.35" filter="url(#softBlur)"/>
  <circle cx="980" cy="240" r="220" fill="#ddd6fe" opacity="0.30" filter="url(#softBlur)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- menu bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#1e1338" opacity="0.42"/>
  <text x="24" y="33" font-size="17" font-weight="700" fill="#ffffff" opacity="0.92">Obsidian</text>
  <text x="118" y="33" font-size="16" fill="#ffffff" opacity="0.7">File  Edit  View</text>
  <!-- right status cluster -->
  <text x="1176" y="33" font-size="16" fill="#ffffff" opacity="0.85" text-anchor="end">Thu Jul 10&#160;&#160;9:41</text>
  <!-- battery -->
  <rect x="988" y="20" width="26" height="13" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.5"/>
  <rect x="990" y="22" width="17" height="9" rx="1.5" fill="#ffffff" opacity="0.85"/>
  <rect x="1015" y="23.5" width="2.5" height="6" rx="1" fill="#ffffff" opacity="0.8"/>
  <!-- active menu-bar crystal (highlighted) -->
  <rect x="780" y="6" width="40" height="40" rx="9" fill="#ffffff" opacity="0.20"/>
  <g transform="translate(800,26)">
    <path d="M0,-13 L11,-3 L7,12 L-7,12 L-11,-3 Z" fill="url(#gem)"/>
    <path d="M0,-13 L0,12 M-11,-3 L11,-3" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M-5,1 L5,1 M-4,5 L4,5" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="1.3"/>
  </g>

  <!-- arrow connecting icon to panel -->
  <path d="M800,101 L782,121 L818,121 Z" fill="#e7e6f4"/>

  <!-- ===== PANEL ===== -->
  <rect x="290" y="120" width="620" height="760" rx="26" fill="#f6f4fb" filter="url(#panelShadow)"/>
  <g clip-path="url(#panelClip)">
    <!-- header band tinted with active tab (blue) -->
    <rect x="290" y="120" width="620" height="92" fill="#3b82f6" opacity="0.14"/>
    <!-- note icon + title -->
    <text x="322" y="176" font-size="26">📅</text>
    <text x="358" y="175" font-size="21" font-weight="700" fill="#211a44">2026-07-10</text>
    <!-- formatting toolbar (centered) -->
    <g transform="translate(497,152)" fill="#3a3358">
      <!-- 9 buttons, 30 wide, 6 gap -->
      <g font-size="16" font-weight="700" text-anchor="middle">
        <text x="15" y="21">B</text>
        <text x="51" y="21" font-style="italic" font-weight="400">I</text>
        <text x="87" y="21" font-weight="400" text-decoration="underline">U</text>
        <text x="123" y="21" font-weight="400" text-decoration="line-through">S</text>
      </g>
      <!-- bullet list -->
      <g fill="#3a3358">
        <circle cx="149" cy="10" r="2"/><rect x="155" y="9" width="14" height="2" rx="1"/>
        <circle cx="149" cy="16" r="2"/><rect x="155" y="15" width="14" height="2" rx="1"/>
        <circle cx="149" cy="22" r="2"/><rect x="155" y="21" width="14" height="2" rx="1"/>
      </g>
      <!-- numbered -->
      <g><text x="180" y="14" font-size="9" font-weight="700" fill="#3a3358">1.</text><rect x="191" y="9" width="13" height="2" rx="1" fill="#3a3358"/>
         <text x="180" y="25" font-size="9" font-weight="700" fill="#3a3358">2.</text><rect x="191" y="21" width="13" height="2" rx="1" fill="#3a3358"/></g>
      <!-- checklist -->
      <g><rect x="213" y="9" width="12" height="12" rx="2.5" fill="none" stroke="#3a3358" stroke-width="1.6"/>
         <path d="M215.5,15 l2.5,2.5 l4.5,-5.5" fill="none" stroke="#3a3358" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
      <!-- link -->
      <g fill="none" stroke="#3a3358" stroke-width="1.8">
        <ellipse cx="248" cy="15" rx="6.5" ry="3.6" transform="rotate(-42 248 15)"/>
        <ellipse cx="257" cy="15" rx="6.5" ry="3.6" transform="rotate(-42 257 15)"/>
      </g>
      <!-- source toggle -->
      <text x="286" y="21" font-size="15" font-weight="700" fill="#7c3aed" font-family="Menlo, monospace">&lt;/&gt;</text>
    </g>
    <!-- overflow menu -->
    <g fill="#4a4368"><circle cx="862" cy="166" r="2.6"/><circle cx="872" cy="166" r="2.6"/><circle cx="882" cy="166" r="2.6"/></g>

    <!-- editor surface -->
    <rect x="290" y="212" width="620" height="578" fill="#ffffff"/>

    <!-- rendered markdown -->
    <text x="322" y="272" font-size="27" font-weight="800" fill="#151229">Thursday · Jul 10</text>

    <text x="322" y="330" font-size="19" font-weight="700" fill="#2a2450">Today</text>
    <!-- task 1 checked -->
    <rect x="322" y="348" width="21" height="21" rx="5" fill="none" stroke="#1c1836" stroke-width="2"/>
    <path d="M326,352 l13,13 M339,352 l-13,13" stroke="#1c1836" stroke-width="2" stroke-linecap="round"/>
    <text x="356" y="365" font-size="18" fill="#201c3a">Ship the Notesidian README</text>
    <text x="616" y="365" font-size="17">✅</text>
    <text x="642" y="365" font-size="15" fill="#7c6fb0" font-family="Menlo, monospace">2026-07-10</text>
    <!-- task 2 -->
    <rect x="322" y="386" width="21" height="21" rx="5" fill="none" stroke="#9a92bb" stroke-width="2"/>
    <text x="356" y="403" font-size="18" fill="#201c3a">Review the open pull requests</text>
    <!-- task 3 -->
    <rect x="322" y="424" width="21" height="21" rx="5" fill="none" stroke="#9a92bb" stroke-width="2"/>
    <text x="356" y="441" font-size="18" fill="#201c3a">Email the design team</text>

    <text x="322" y="500" font-size="19" font-weight="700" fill="#2a2450">Notes</text>
    <text x="322" y="536" font-size="18" fill="#201c3a">Standup went <tspan font-weight="800">well</tspan> — shipping <tspan font-style="italic">Friday</tspan>.</text>
    <!-- bullets -->
    <circle cx="330" cy="568" r="3.2" fill="#201c3a"/>
    <text x="348" y="574" font-size="18" fill="#201c3a">Coffee with Sam at 2pm</text>
    <circle cx="330" cy="600" r="3.2" fill="#201c3a"/>
    <text x="348" y="606" font-size="18" fill="#201c3a">Book flights for the offsite</text>
    <!-- link line -->
    <text x="322" y="646" font-size="18" fill="#201c3a">See the <tspan fill="#7c3aed" text-decoration="underline">Q3 roadmap</tspan> before Monday.</text>

    <!-- bottom bar -->
    <rect x="290" y="790" width="620" height="90" fill="#ece9f3"/>
    <line x1="290" y1="790" x2="910" y2="790" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>
    <!-- pills -->
    <!-- active -->
    <rect x="322" y="808" width="70" height="52" rx="14" fill="#3b82f6"/>
    <rect x="320" y="806" width="74" height="56" rx="16" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="3"/>
    <text x="357" y="842" font-size="22" text-anchor="middle">📅</text>
    <rect x="404" y="812" width="66" height="46" rx="13" fill="#64748b" opacity="0.9"/>
    <text x="437" y="843" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <rect x="482" y="812" width="66" height="46" rx="13" fill="#22c55e" opacity="0.9"/>
    <text x="515" y="843" font-size="20" text-anchor="middle">✅</text>
    <rect x="560" y="812" width="66" height="46" rx="13" fill="#f59e0b" opacity="0.9"/>
    <text x="593" y="843" font-size="20" text-anchor="middle">💡</text>
    <rect x="638" y="812" width="66" height="46" rx="13" fill="#ec4899" opacity="0.9"/>
    <text x="671" y="843" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <rect x="716" y="812" width="66" height="46" rx="13" fill="#14b8a6" opacity="0.9"/>
    <text x="749" y="843" font-size="20" text-anchor="middle">📓</text>
    <!-- gear -->
    <g transform="translate(862,835)" fill="none" stroke="#6b6488" stroke-width="2.4">
      <circle cx="0" cy="0" r="6.5"/>
      <g stroke-linecap="round">
        <path d="M0,-13 L0,-9 M0,9 L0,13 M-13,0 L-9,0 M9,0 L13,0"/>
        <path d="M-9.2,-9.2 L-6.4,-6.4 M9.2,9.2 L6.4,6.4 M9.2,-9.2 L6.4,-6.4 M-9.2,9.2 L-6.4,6.4"/>
      </g>
    </g>
  </g>
</svg>
